# ~/.config/mise/config.toml. Managed in ~/dotfiles/mise/config.toml
# `mise use --global ...` edits this file through the symlink, so changes
# show up in your dotfiles repo for you to commit.

[tools]
node = "24"
pnpm = "latest"
python = "3.13"                 # one behind latest for library compatibility

# Global CLIs pinned independently of Node, added when actually needed, e.g.:
# "npm:typescript" = "latest"

[settings]
# Let mise read .nvmrc / .node-version / .python-version / .java-version /
# global.json in existing projects, so `mise install` there picks the
# project's version without changing the global one.
idiomatic_version_file_enable_tools = ["node", "python", "java", "dotnet"]
